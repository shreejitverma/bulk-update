[project]
name = "anzorlist"
version = "0.1.0"
description = "Extract Anzor Jewelry products and create draft marketplace listings (Amazon/eBay/Etsy)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "tenacity>=8.3",
    "structlog>=24.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "jsonschema>=4.26.0",
    "boto3>=1.43.88",
    "anthropic>=1.3.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "pillow>=12.3.0",
]

[project.scripts]
anzorlist = "anzorlist.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anzorlist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: `str, Enum` is kept over `StrEnum` — pydantic v2 serialises it identically and the
# codebase was written against it. UP017: `timezone.utc` is explicit at a glance; `datetime.UTC`
# reads as a datetime instance.
ignore = ["UP042", "UP017"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
