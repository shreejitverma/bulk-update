name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: |
          uv run ruff format --check .
          uv run black --check .
      - name: Types
        run: uv run mypy anzorlist
      - name: Tests (offline; no credentials)
        run: uv run pytest -q
