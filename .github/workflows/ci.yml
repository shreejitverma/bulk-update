name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: |
          uv run ruff format --check .
          uv run black --check .
      - name: Types
        run: uv run mypy anzorlist
      - name: Tests (offline; no credentials)
        # The suite is fully offline: it runs against committed fixtures and fake marketplaces,
        # with no network and no credentials, so CI needs no secrets and cannot touch a live
        # Amazon, eBay or Etsy account.
        run: uv run pytest -q
      - name: Verify the pipeline still builds a listing offline
        # A green unit suite with a broken end-to-end path is the failure mode that matters
        # here, so CI exercises the real fixture -> Amazon payload route on every push.
        run: uv run python scripts/smoke_build.py
